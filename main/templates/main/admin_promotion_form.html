{% extends 'main/admin_base.html' %}
{% block content %}
<div class="page">
  <h1>{% if add_mode %}เพิ่มโปรโมชั่นใหม่{% else %}แก้ไขโปรโมชั่น{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_title">ชื่อโปรโมชั่น</label>
      {{ form.title }}
    </div>
    <div class="form-group">
      <label for="id_description">รายละเอียด</label>
      {{ form.description }}
    </div>
    <div class="form-group">
      <label for="id_is_active">เปิดใช้งาน</label>
      {{ form.is_active }}
    </div>
    <button type="submit" class="btn-save">บันทึก</button>
    <a href="{% url 'admin_promotion_list' %}" class="btn-cancel">ยกเลิก</a>
  </form>
</div>
{% endblock %}
