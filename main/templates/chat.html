{% load static i18n %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>{% trans "Chokdee Chatbot" %}</title>
    <link rel="stylesheet" href="{% static 'css/chat.css' %}">
</head>
<body>
    <div id="chat-widget">
        <div id="chat-panel" style="display:none;">
            <div id="chat-header">
                 <span style="font-size:1.5rem;font-weight:bold;">Chokdee Thai Massage</span>
                 <span style="flex:1"></span>
                 <button onclick="closeChat()" style="background:none;border:none;font-size:1.3rem;color:#fff;cursor:pointer;">×</button>
            </div>
            <div id="chat-box"></div>
            <div id="chat-input-row">
                <input
                    type="text"
                    id="chat-input"
                    placeholder="{% trans 'พิมพ์ข้อความ...' %}"
                    onkeydown="if(event.key==='Enter'){sendMessage()}"
                    autocomplete="off"
                />
                <button id="chat-send-btn" onclick="sendMessage()">{% trans "ส่ง" %}</button>
            </div>
        </div>

        <div id="chat-bubble" onclick="openChat()" title="{% trans 'คุยกับแชตบอท' %}">
            💬
        </div>
    </div>

    <script>
    const chatPanel = document.getElementById('chat-panel');
    const chatBubble = document.getElementById('chat-bubble');

    function openChat() {
        chatPanel.style.display = 'flex';
        chatBubble.style.display = 'none';
        setTimeout(() => document.getElementById('chat-input').focus(), 200);
    }
    function closeChat() {
        chatPanel.style.display = 'none';
        chatBubble.style.display = 'flex';
    }

    // แปลง markdown/ข้อความยาวเป็น HTML อ่านง่าย
    function formatBotReply(text) {
        text = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        text = text.replace(/\n\* /g, '<br>• ');
        text = text.replace(/\n/g, '<br>');
        return text;
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) return;

        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML += `<div class="message user"><b>{% trans "คุณ:" %}</b> ${message}</div>`;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const res = await fetch("{% url 'chat_api' %}", {
                method: "POST",
                headers: { "X-CSRFToken": "{{ csrf_token }}" },
                body: new URLSearchParams({ message })
            });

            const data = await res.json();

            if (data.reply) {
                chatBox.innerHTML += `<div class="message bot"><b>Chokdee:</b> ${formatBotReply(data.reply)}</div>`;
            } else {
                chatBox.innerHTML += `<div class="message bot" style="color:red;">{% trans "เกิดข้อผิดพลาด:" %} ${data.error}</div>`;
            }
        } catch (e) {
            chatBox.innerHTML += `<div class="message bot" style="color:red;">{% trans "เกิดข้อผิดพลาด: ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์" %}</div>`;
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }
    </script>
</body>
</html>
